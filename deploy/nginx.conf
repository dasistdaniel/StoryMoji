# Sample nginx server block for Storymoji.
# Copy the contents of `dist/` to `root` below, then reload nginx.
#
# GDPR data minimisation: access logs record an anonymised IP address (last
# IPv4 octet / last IPv6 group zeroed) instead of the full address – see
# datenschutz.html section 4. `map`/`log_format` must live in nginx's http {}
# context; if this file is included via sites-enabled (the usual Debian/
# Ubuntu layout, itself included inside http {}), the two blocks below can
# stay here. If your install includes server blocks some other way, move
# them into nginx.conf's http {} block instead.
map $remote_addr $remote_addr_anon {
    "~(?P<ip>\d+\.\d+\.\d+)\.\d+"      $ip.0;
    "~(?P<ip>[^:]+:[^:]+):.*"          $ip::;
    default                            0.0.0.0;
}

log_format privacy
    '$remote_addr_anon - [$time_local] "$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name storymoji.nichtregistriert.de;

    root /var/www/storymoji;
    index index.html;

    access_log /var/log/nginx/storymoji-access.log privacy;

    # Vite emits fingerprinted files under /assets – cache them forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The manifest and icons change rarely; a short cache is fine.
    location ~* \.(webmanifest|svg|png|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Service worker (added in v1.1) must never be cached.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # SPA-style fallback: unknown paths serve index.html so deep links work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: gzip (or use nginx's brotli module if available).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;
}
