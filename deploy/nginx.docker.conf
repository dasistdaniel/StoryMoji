# nginx config for the Storymoji container (served on port 80 inside the
# container; docker-compose maps it to the host port).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits fingerprinted files under /assets – cache them forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Manifest and icons change rarely.
    location ~* \.(webmanifest|svg|png|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Service worker (added in v1.1) must never be cached.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # SPA-style fallback so deep links / shared #d= hashes work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml
        application/manifest+json;
    gzip_min_length 512;
}
