# nginx config for the Storymoji container (served on port 80 inside the
# container; docker-compose maps it to the host port).
#
# GDPR data minimisation: access logs record an anonymised IP address (last
# IPv4 octet / last IPv6 group zeroed) instead of the full address – see
# datenschutz.html section 4. This file is included inside nginx's http {}
# block (via conf.d/*.conf in the base image), so `map`/`log_format` at the
# top level here are valid, same as in nginx.conf.
map $remote_addr $remote_addr_anon {
    "~(?P<ip>\d+\.\d+\.\d+)\.\d+"      $ip.0;
    "~(?P<ip>[^:]+:[^:]+):.*"          $ip::;
    default                            0.0.0.0;
}

log_format privacy
    '$remote_addr_anon - [$time_local] "$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log privacy;

    # Vite emits fingerprinted files under /assets – cache them forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Manifest and icons change rarely.
    location ~* \.(webmanifest|svg|png|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Service worker (added in v1.1) must never be cached.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # SPA-style fallback so deep links / shared #d= hashes work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml
        application/manifest+json;
    gzip_min_length 512;
}
